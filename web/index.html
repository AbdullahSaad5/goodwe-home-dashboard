<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f9fc" />
    <script>
      (() => {
        try {
          const saved = window.localStorage.getItem('goodwe-theme');
          const theme =
            saved === 'light' || saved === 'dark'
              ? saved
              : window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = theme;
          document.documentElement.classList.toggle('dark', theme === 'dark');
          document.documentElement.style.colorScheme = theme;
          document
            .querySelector('meta[name="theme-color"]')
            ?.setAttribute('content', theme === 'dark' ? '#0b1220' : '#f7f9fc');
        } catch {
          document.documentElement.dataset.theme = 'light';
        }
      })();
    </script>
    <meta name="description" content="Private local monitoring for a GoodWe home energy system." />
    <meta property="og:title" content="GoodWe Home" />
    <meta
      property="og:description"
      content="Your home energy, understood. Private GoodWe monitoring on your local network."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="GoodWe Home" />
    <meta
      name="twitter:description"
      content="Private local energy monitoring for your GoodWe system."
    />
    <meta name="twitter:image" content="/og.png" />
    <link rel="icon" href="/og.png" />
    <title>GoodWe Home</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
